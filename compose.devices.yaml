# The Devices module's sidecar, as an option: setup.sh --devices names it in
# compose.override.yaml. One container, built from module-devices's sidecar/, with three
# services in it:
#
# - an MQTT broker (Mosquitto) for the devices, with no anonymous clients: EiN signs in as `ein` and
#   the devices as `device`, with MQTT_EIN_PASSWORD and MQTT_DEVICE_PASSWORD from .env. The devices
#   on this machine's network reach it on MQTT_PORT of EIN_BIND; it keeps retained messages, such as
#   the devices' announcements, in EIN_DATA/mqtt across restarts;
# - a listener for what announces itself on this machine's network, published on the broker for the
#   Devices module to offer as devices;
# - a restreamer (go2rtc) for cameras: one connection to each camera, served again to EiN, which
#   shows it in its pages and writes it into the camera's stream nodes for the media service. Its API
#   is on STREAMS_PORT of EIN_BIND, behind the account `ein` and STREAMS_PASSWORD, and answers only
#   the paths EiN uses.
#
# It is on the host's network: the listener's multicast never leaves the network it is sent on. All
# three run as EIN_USER, who owns the data folder (setup.sh), with no capabilities.
#
# The image is the release GitHub publishes from module-devices that .env pins, EIN_DEVICES_VERSION.
# From any source but GitHub's einhq, compose.override.yaml builds it here instead, as
# localhost/ein-devices from src/module-devices/sidecar.
services:
  devices:
    image: ghcr.io/einhq/devices:${EIN_DEVICES_VERSION:-unpinned}
    restart: unless-stopped
    network_mode: host
    user: ${EIN_USER:?run setup.sh, which writes .env}
    cap_drop: [ALL]
    security_opt: [no-new-privileges]
    mem_limit: 512m
    memswap_limit: 512m
    volumes:
      - ${EIN_DATA}/mqtt:/data/mqtt:z
    environment:
      EIN_BIND: ${EIN_BIND:-0.0.0.0}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_EIN_PASSWORD: ${MQTT_EIN_PASSWORD}
      MQTT_DEVICE_PASSWORD: ${MQTT_DEVICE_PASSWORD}
      STREAMS_PORT: ${STREAMS_PORT:-1984}
      STREAMS_PASSWORD: ${STREAMS_PASSWORD}
