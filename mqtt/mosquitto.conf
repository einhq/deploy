# The MQTT broker module-automation's devices talk to (compose.mqtt.yaml). Every client signs in:
# EiN as `ein`, the devices as `device`, with the passwords setup.sh keeps in .env and writes, hashed,
# into the data folder, which the image gives the broker's own user.
listener 1883
allow_anonymous false
password_file /mosquitto/data/passwords
persistence true
persistence_location /mosquitto/data/
log_dest stdout
