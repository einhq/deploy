# The media service, every media tool and model behind one HTTP API, as an option: setup.sh --ems
# names it in compose.override.yaml, with the graphics card when there is one. It mounts none of
# EiN's folders: it mounts the files of each request from EiN's ems-files service with sshfs, for
# which compose.override.yaml gives it /dev/fuse and this file SYS_ADMIN, the capability to mount,
# and no AppArmor profile: Docker's docker-default, on Ubuntu and Debian, denies mount whatever the
# capabilities, and every request that names a file would wait as files_unavailable.
#
# A file it reads may be made to take over the program reading it, so it has no more than it
# needs. It starts as root to read ems.keys, which is its owner's alone, and runs on as the user
# ems with no capabilities: SETUID, SETGID and SETPCAP are for that change, DAC_READ_SEARCH reads
# ems.keys under Docker, where it is another user's, and of the rest it keeps SYS_ADMIN, which only
# the setuid fusermount3 takes up, and SYS_CHROOT, for Chromium's sandbox. It is not on the
# database's network, and of .env it gets its EMS_ lines and TZ alone, which compose.override.yaml
# names: setup.sh writes them there, so an EMS_ line added to .env reaches it at the next setup.sh.
#
# The image is the release GitHub publishes from ein/ems that .env pins, EIN_EMS_VERSION. From any
# source but GitHub's einhq, compose.override.yaml builds it here instead, as localhost/ein-ems from
# src/ems.
services:
  ems:
    image: ghcr.io/einhq/ems:${EIN_EMS_VERSION:-unpinned}
    restart: unless-stopped
    stop_grace_period: 60s
    cap_drop: [ALL]
    cap_add: [SYS_ADMIN, SYS_CHROOT, SETUID, SETGID, SETPCAP, DAC_READ_SEARCH]
    security_opt: [apparmor=unconfined]
    environment:
      EMS_PORT: 8181
      EMS_KEY: ${EMS_KEY}
    mem_limit: ${EMS_MEMORY:-16g}
    memswap_limit: ${EMS_MEMORY:-16g}
    # Unhealthy after minutes without an answer: a crawl can stall every check on the host for a
    # while, and EMS keeps serving through it.
    healthcheck:
      test: [CMD, python3, -m, ems.healthcheck]
      interval: 30s
      timeout: 60s
      retries: 5
      start_period: 120s
