# The MQTT broker module-automation's devices talk to, as an option: setup.sh --mqtt names it in
# compose.override.yaml. Mosquitto, with no anonymous clients: EiN signs in as `ein` and the devices
# as `device`, with MQTT_EIN_PASSWORD and MQTT_DEVICE_PASSWORD from .env, which setup.sh hashes into
# EIN_DATA/mqtt/passwords. The devices on this machine's network reach it on MQTT_PORT of EIN_BIND;
# it keeps retained messages, such as the devices' announcements, in EIN_DATA/mqtt across restarts.
#
# Beside it, discovery: what announces itself on this machine's network over mDNS and SSDP, published
# on the broker as `ein`, for the Automation module to offer as devices (mqtt/discovery.ts says what
# it publishes). It is on the host's network, as the multicast it asks with never leaves the network
# it is sent on, and reaches the broker where the broker is published.
services:
  mqtt:
    image: ${MQTT_IMAGE:-docker.io/library/eclipse-mosquitto:2}
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    volumes:
      - ./mqtt/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro,z
      - ${EIN_DATA}/mqtt:/mosquitto/data:z
    ports:
      - '${EIN_BIND:-0.0.0.0}:${MQTT_PORT:-1883}:1883'

  discovery:
    image: ${DISCOVERY_IMAGE:-docker.io/denoland/deno:alpine-2.6.3}
    restart: unless-stopped
    network_mode: host
    mem_limit: 128m
    memswap_limit: 128m
    volumes:
      - ./mqtt/discovery.ts:/discovery.ts:ro,z
    environment:
      MQTT_HOST: ${EIN_BIND:-0.0.0.0}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ein
      MQTT_PASSWORD: ${MQTT_EIN_PASSWORD}
    command: [run, --unstable-net, --allow-net, --allow-env, --allow-run=cat, --allow-sys=networkInterfaces, /discovery.ts]
    depends_on: [mqtt]
