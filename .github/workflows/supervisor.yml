name: supervisor

# The supervisor's image (supervisor/Containerfile), published for installations to pull:
# ghcr.io/einhq/supervisor:<version>, one image a release of this repository's version.json, built
# from its tag (v<version>, which the daily publish pushes with the snapshot that holds it,
# ein/core#1287) and never built again, so a version names one image. setup.sh moves an
# installation's deploy to the newest release that has its image. The label eu.einhq.version says
# the version too. Run by hand on a tag, it builds that release when it has no image yet, as after a
# failed build.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

concurrency:
  group: supervisor
  cancel-in-progress: false

jobs:
  # Whether to build: a release that has its image already is left as it is.
  check:
    # GitHub alone publishes: a Forgejo that runs this repository's workflows has no use for it.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
      build: ${{ steps.check.outputs.build }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/supervisor
        run: |
          version=$(jq -r .version version.json)
          [[ $version =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "no release version in version.json: $version"; exit 1; }
          [ "$GITHUB_REF" = "refs/tags/v$version" ] || { echo "$GITHUB_REF is not the release tag v$version"; exit 1; }
          echo "version=$version" >>"$GITHUB_OUTPUT"
          if docker manifest inspect "$IMAGE:$version" >/dev/null 2>&1; then
            echo "$IMAGE:$version exists"
            echo build=false >>"$GITHUB_OUTPUT"
          else
            echo build=true >>"$GITHUB_OUTPUT"
          fi

  image:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: supervisor
          file: supervisor/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/supervisor:${{ needs.check.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.check.outputs.version }}
            eu.einhq.version=${{ needs.check.outputs.version }}
            org.opencontainers.image.description=EiN's supervisor: installs and updates the services beside EiN when EiN asks, run by compose from ein/deploy
